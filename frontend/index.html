<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F1E8" />
    <title>Portfolio Pilot — Measure risk, track return, stay diversified.</title>
    <meta name="description" content="Quantitative portfolio risk, return, and diversification analysis on your own price history." />
    <script>
      try {
        var t = localStorage.getItem("pp_theme");
        document.documentElement.dataset.theme = t === "paper" || t === "carbon" ? t : "paper";
      } catch (e) {
        document.documentElement.dataset.theme = "paper";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
